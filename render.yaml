services:
  # 1. Backend FastAPI Web Service
  - type: web
    name: thelastseat-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thelastseat-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: USE_FAKEREDIS_IF_NO_REDIS
        value: "true"
      - key: USE_SQLITE_IF_NO_PG
        value: "true"
      - key: PORT
        value: "8000"

  # 2. Frontend React / Vite Static Site
  - type: static_site
    name: thelastseat-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: thelastseat-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Free Managed PostgreSQL
  - name: thelastseat-db
    plan: free
    region: oregon
    databaseName: concert_booking
    user: concert_user
